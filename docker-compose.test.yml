services:
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: rag_foundry_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__ENABLE_STATIC_CONTENT=1

  redis:
    image: redis:7.4-alpine
    container_name: rag_foundry_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    container_name: rag_foundry_tei
    ports:
      - "8080:80"
    environment:
      - MODEL_ID=BAAI/bge-small-en-v1.5
      - PORT=80
    command: ["--model-id", "BAAI/bge-small-en-v1.5", "--port", "80"]

volumes:
  qdrant_data:
  redis_data:
